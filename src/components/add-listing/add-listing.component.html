<div class="fixed inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center p-4" (click)="closeModal.emit()">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg transform transition-all max-h-[90vh] overflow-y-auto" (click)="$event.stopPropagation()">
    <div class="flex justify-between items-center p-5 border-b border-gray-200 sticky top-0 bg-white">
      <h3 class="text-xl font-semibold text-gray-800">Share Surplus Food</h3>
      <button (click)="closeModal.emit()" class="text-gray-400 hover:text-gray-600">
        <i class="ph ph-x text-2xl"></i>
      </button>
    </div>

    <form #listingForm="ngForm" (ngSubmit)="onSubmit(listingForm)" class="p-6 space-y-4">
       <div>
        <label for="foodImage" class="block text-sm font-medium text-gray-700">Food Image</label>
        <div class="mt-1 flex items-center space-x-4">
          @if(selectedImage()) {
            <img [src]="selectedImage()" alt="Selected food" class="h-20 w-20 object-cover rounded-md">
          } @else {
             <div class="h-20 w-20 bg-gray-100 rounded-md flex items-center justify-center">
                <i class="ph ph-image text-4xl text-gray-400"></i>
            </div>
          }
          <label for="foodImage" class="cursor-pointer bg-white py-2 px-3 border border-gray-300 rounded-md shadow-sm text-sm leading-4 font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
            <span>Upload a photo</span>
            <input id="foodImage" name="foodImage" type="file" class="sr-only" (change)="onFileSelected($event)" accept="image/*">
          </label>
        </div>
      </div>

      <div>
        <label for="description" class="block text-sm font-medium text-gray-700">Description</label>
        <textarea id="description" name="description" ngModel required minlength="10" #description="ngModel" rows="3"
          placeholder="e.g., '10 loaves of sourdough and 2 boxes of croissants from The Corner Bakery'"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500 sm:text-sm"></textarea>
        @if (description.invalid && (description.dirty || description.touched)) {
          <p class="text-xs text-red-500 mt-1">A description of at least 10 characters is required.</p>
        }
      </div>

      <div class="relative">
        <button type="button" (click)="generateWithAI(listingForm)" [disabled]="aiIsThinking() || description.invalid"
          class="w-full flex items-center justify-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 disabled:bg-green-300 disabled:cursor-not-allowed">
          @if (aiIsThinking()) {
            <div class="animate-spin rounded-full h-5 w-5 border-b-2 border-white"></div>
            <span class="ml-2">Analyzing...</span>
          } @else {
            <i class="ph ph-sparkle mr-2 text-lg"></i>
            <span>Generate Details with AI</span>
          }
        </button>
         @if(aiError()) {
           <p class="text-xs text-red-500 mt-2 text-center">{{ aiError() }}</p>
         }
      </div>

       <hr class="border-gray-200 my-4" />

       <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label for="foodType" class="block text-sm font-medium text-gray-700">Food Type</label>
          <input type="text" id="foodType" name="foodType" ngModel required #foodType="ngModel"
            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500 sm:text-sm"
            placeholder="e.g., Baked Goods">
        </div>
         <div>
          <label for="quantity" class="block text-sm font-medium text-gray-700">Quantity</label>
          <input type="text" id="quantity" name="quantity" ngModel required #quantity="ngModel"
            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500 sm:text-sm"
            placeholder="e.g., 2 large boxes">
        </div>
      </div>
      
      <div>
        <label for="donorName" class="block text-sm font-medium text-gray-700">Donor Name</label>
        <input type="text" id="donorName" name="donorName" ngModel required #donorName="ngModel"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500 sm:text-sm"
          placeholder="e.g., The Corner Bakery">
      </div>
     
      <div>
        <label for="pickupLocation" class="block text-sm font-medium text-gray-700">Pickup Location</label>
        <input type="text" id="pickupLocation" name="pickupLocation" ngModel required #pickupLocation="ngModel"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500 sm:text-sm"
          placeholder="e.g., 123 Main St">
      </div>
      
      <div class="pt-4 flex justify-end space-x-3">
        <button type="button" (click)="closeModal.emit()" class="bg-white py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
          Cancel
        </button>
        <button type="submit" [disabled]="listingForm.invalid"
          class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 disabled:bg-gray-300">
          Add Listing
        </button>
      </div>
    </form>
  </div>
</div>
